services:
  # Node.js Web Server + Coding Agent
  web:
    build:
      context: .
      target: node-server
    container_name: brightforge-web
    ports:
      # Published on host loopback only; change deliberately to expose on a LAN
      - "127.0.0.1:3847:3847"
    environment:
      # LLM Provider API Keys (override in .env.docker)
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Server config
      - PORT=3847
      # Inside the container the server must bind all interfaces to be reachable
      # through the port mapping; bind-policy.js then REQUIRES an API key.
      - BRIGHTFORGE_HOST=0.0.0.0
      - BRIGHTFORGE_API_KEY=${BRIGHTFORGE_API_KEY:-}
      - NODE_ENV=production
    volumes:
      # Persist database and generated assets
      - brightforge-data:/app/data
      # Persist session logs
      - brightforge-sessions:/app/sessions
    depends_on:
      - python
    restart: unless-stopped
    networks:
      - brightforge

  # Python Inference Server (GPU-accelerated 3D generation)
  python:
    build:
      context: .
      target: python-server
    container_name: brightforge-python
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Persist model cache (avoids re-downloading SDXL/InstantMesh on restart)
      - huggingface-cache:/root/.cache/huggingface
      # Persist generated outputs
      - brightforge-data:/app/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - brightforge

  # ----------------------------------------------------------------------------
  # Test profiles (docker compose --profile test run --rm brightforge-test)
  # No network, read-only root filesystem, size-limited tmpfs for writable
  # paths, no capabilities, bounded CPU/memory/PIDs, no host mounts, no Docker
  # socket and no API keys.
  # ----------------------------------------------------------------------------
  brightforge-test:
    profiles: ["test"]
    build:
      context: .
      target: test
    image: brightforge-test:local
    network_mode: "none"
    read_only: true
    user: "node"
    environment:
      - NODE_ENV=test
      - SUITE_TIMEOUT_MS=300000
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /app/data:size=256m,uid=1000,gid=1000
      - /app/sessions:size=64m,uid=1000,gid=1000
      - /app/logs:size=64m,uid=1000,gid=1000
      - /app/output:size=64m,uid=1000,gid=1000
      - /app/qa-reports:size=16m,uid=1000,gid=1000
      - /app/.claude:size=16m,uid=1000,gid=1000
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0

  brightforge-python-test:
    profiles: ["test"]
    build:
      context: .
      target: python-test
    image: brightforge-python-test:local
    network_mode: "none"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0

  # Opt-in live Ollama check (docker compose --profile ollama run --rm brightforge-ollama-test)
  # Ollama must already be running on the host WITH the model installed;
  # nothing is pulled. Bridge network only (it must reach the host).
  brightforge-ollama-test:
    profiles: ["ollama"]
    image: brightforge-test:local
    build:
      context: .
      target: test
    read_only: true
    user: "node"
    command: ["node", "src/tests/llm-provider-contract.js", "--live"]
    environment:
      - NODE_ENV=test
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3:8b}
      - OLLAMA_TIMEOUT_MS=${OLLAMA_TIMEOUT_MS:-120000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/data:size=64m,uid=1000,gid=1000
      - /app/logs:size=16m,uid=1000,gid=1000
      - /app/.claude:size=16m,uid=1000,gid=1000
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0

volumes:
  brightforge-data:
    driver: local
  brightforge-sessions:
    driver: local
  huggingface-cache:
    driver: local

networks:
  brightforge:
    driver: bridge
