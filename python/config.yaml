# Forge3D Python Inference Server Configuration
# All values can be adjusted without code changes.
# Loaded by inference_server.py and model_manager.py

server:
  default_port: 8001
  default_host: "127.0.0.1"

paths:
  output_dir: "data/output"
  temp_dir: "data/temp"
  models_dir: "data/models"

models:
  hunyuan3d:
    repo_id: "tencent/Hunyuan3D-2"
    # Shape weights are read from <models_dir>/<repo_id>/hunyuan3d-dit-v2-0
    # (relative to python/; HY3DGEN_MODELS overrides). Fetch only the fp16 file:
    #   python -c "from huggingface_hub import snapshot_download as s; s('tencent/Hunyuan3D-2', allow_patterns=['hunyuan3d-dit-v2-0/config.yaml','hunyuan3d-dit-v2-0/model.fp16.safetensors'], local_dir='data/models/hy3dgen/tencent/Hunyuan3D-2')"
    models_dir: "../data/models/hy3dgen"
    required_vram_gb: 12.0
    input_dimensions: [512, 512]
    inference_steps: 50
    guidance_scale: 5.5
    size_mb: 8000
    texture_enabled: true
    remove_background: true
  sdxl:
    repo_id: "stabilityai/stable-diffusion-xl-base-1.0"
    required_vram_gb: 8.0
    guidance_scale: 7.5
    memory_optimization: "attention_slicing"
  shap_e:
    enabled: true
    repo_id: "openai/shap-e"
    required_vram_gb: 4.0
    input_dimensions: [256, 256]
    inference_steps: 64
    guidance_scale: 15.0

model_registry:
  default_mesh_model: "shap-e"
  default_image_model: "sdxl"

vram:
  buffer_gb: 2.0
  generation_count_before_restart: 20

generation:
  accepted_mime_types:
    - "image/png"
    - "image/jpeg"
    - "image/webp"
  max_upload_size_bytes: 20971520  # 20 MB
  max_image_dimension: 4096
  min_image_dimension: 512
  min_steps: 10
  max_steps: 100
  min_prompt_length: 3
  max_prompt_length: 2000

cleanup:
  temp_file_max_age_hours: 24

environment:
  min_python_version: [3, 10]
  min_vram_gb: 8

setup:
  install_timeout_seconds: 600
  model_download_timeout_seconds: 1800

validation:
  min_mesh_file_size_bytes: 100

fbx_export:
  enabled: true
  preferred_backend: "blender"  # blender | assimp | auto. Blender gives the most reliable FBX for Unreal; pyassimp needs a native assimp library
  blender_path: null  # auto-detect if null (BRIGHTFORGE_BLENDER env, PATH, then the globs below)
  blender_search_globs:  # standard install locations; newest match wins
    - "%ProgramFiles%/Blender Foundation/Blender */blender.exe"
    - "/Applications/Blender.app/Contents/MacOS/Blender"
    - "/usr/bin/blender"
  scale_factor: 100.0  # meters -> centimeters for Unreal
  coordinate_system: "unreal"  # unreal (Z-up, cm) | default

texture_generation:
  default_resolution: 1024
  supported_resolutions: [512, 1024, 2048]
  default_style:
    roughness: 0.5
    metallic: 0.0
  inference_steps: 50
  guidance_scale: 7.5

quality:  # used by python/mesh_quality.py
  degenerate_area_epsilon: 1.0e-12   # faces at or below this area are degenerate
  uv_overlap_resolution: 256         # UV raster size for overlap measurement
  uv_overlap_max_faces: 50000        # above this, overlap is reported as unknown (not guessed)
  texel_density_texture_size: 1024   # texture size assumed for texel density

uv_validation:
  overlap_threshold: 0.05
  min_texel_density: 0.5
  auto_unwrap_enabled: true

material_presets:
  ue5-standard:
    shading_model: "DefaultLit"
    base_color: [0.8, 0.8, 0.8]
    metallic: 0.0
    roughness: 0.5
    emissive: [0.0, 0.0, 0.0]
  ue5-metallic:
    shading_model: "DefaultLit"
    base_color: [0.7, 0.7, 0.75]
    metallic: 0.9
    roughness: 0.2
    emissive: [0.0, 0.0, 0.0]
  ue5-clay:
    shading_model: "DefaultLit"
    base_color: [0.85, 0.75, 0.65]
    metallic: 0.0
    roughness: 0.8
    emissive: [0.0, 0.0, 0.0]
