# LLCApp - LLM Provider Configuration
# Priority: FREE providers first, paid as fallback

providers:
  # Priority 1: FREE Local (always try first when available)
  ollama:
    enabled: true
    base_url: "http://127.0.0.1:11434/v1"
    api_key: null  # No key needed for local
    # Each role lists candidate model tags in preference order. The first tag
    # that is installed in Ollama is used; missing tags are skipped. If none is
    # installed, the request fails with MODEL_UNAVAILABLE and the task router
    # moves on to the next provider. Change models here, or pin them with
    # OLLAMA_MODEL (all chat roles) or OLLAMA_MODEL_<ROLE>; no code changes.
    models:
      code: ["qwen2.5-coder:14b-instruct-q6_K", "qwen2.5-coder:14b"]
      fast: ["qwen2.5-coder:14b-instruct-q6_K", "qwen2.5-coder:14b"]
      embed: ["nomic-embed-text"]
    model_cache_ttl_ms: 30000  # how long the installed-model list is reused
    priority: 1
    cost_per_1k_tokens: 0
    requires_local: true

  # Priority 2: FREE Cloud APIs
  groq:
    enabled: true
    base_url: "https://api.groq.com/openai/v1"
    api_key_env: "GROQ_API_KEY"
    # Llama 3.x shut down on Groq 2026-08-16; replacements per Groq's
    # deprecation table (checked 2026-11-07). Free tier lists gpt-oss-120b and
    # qwen3.8-27b (1,000 req/day each). gpt-oss-20b would be faster for "fast"
    # but is paid ($0.075/$0.30 per 1M), so every role stays on the free model.
    models:
      default: "openai/gpt-oss-120b"
      fast: "openai/gpt-oss-120b"
      code: "openai/gpt-oss-120b"
    priority: 2
    cost_per_1k_tokens: 0
    rate_limit:
      tokens_per_minute: 14000
      requests_per_minute: 30

  cerebras:
    enabled: true
    base_url: "https://api.cerebras.ai/v1"
    api_key_env: "CEREBRAS_API_KEY"
    # llama-3.3-70b deprecated 2026-02-16; Cerebras recommends GPT OSS 120B,
    # and qwen-3.8-27b for Shared Inference (checked 2026-11-07).
    models:
      default: "gpt-oss-120b"
      code: "qwen-3.8-27b"
    priority: 3
    cost_per_1k_tokens: 0
    rate_limit:
      requests_per_minute: 30

  # Disabled 2026-11-07: both configured models were removed from Together's
  # serverless tier (Qwen2.5-Coder-32B on 2025-11-13, Llama-3.3-70B-Turbo on
  # 2026-10-22). Pick current IDs from Together's catalog before re-enabling.
  together:
    enabled: false
    base_url: "https://api.together.xyz/v1"
    api_key_env: "TOGETHER_API_KEY"
    models:
      code: "Qwen/Qwen2.5-Coder-32B-Instruct"
      default: "meta-llama/Llama-3.3-70B-Instruct-Turbo"
    priority: 4
    cost_per_1k_tokens: 0.0008  # ~$25 free credit
    free_credit: 25.00

  mistral:
    enabled: true
    base_url: "https://api.mistral.ai/v1"
    api_key_env: "MISTRAL_API_KEY"
    models:
      code: "codestral-latest"
      default: "mistral-small-latest"
    priority: 5
    cost_per_1k_tokens: 0  # Free tier

  # Priority 5.5: Google Gemini (free tier + paid)
  gemini:
    enabled: true
    base_url: "https://generativelanguage.googleapis.com/v1beta"
    api_key_env: "GEMINI_API_KEY"
    # gemini-2.0-flash shut down 2026-06-01. 2.5 Flash/Flash-Lite/Pro are on
    # the AI Studio free tier (free-tier data is used to improve Google products).
    # Costs are 0 on the free tier. If billing is enabled, set the paid input
    # prices per 1K tokens (2.5 Flash-Lite 0.0001, 2.5 Flash 0.0003; checked 2026-10-25).
    models:
      default: "gemini-2.5-flash-lite"
      code: "gemini-2.5-flash"
      complex: "gemini-2.5-pro"
    priority: 5
    cost_per_1k_tokens:
      flash-lite: 0.0
      flash: 0.0
      pro: 0.0

  # Priority 6: Paid Cloud (fallback for complex tasks)
  claude:
    enabled: true
    base_url: "https://api.anthropic.com/v1"
    api_key_env: "CLAUDE_API_KEY"
    # Current Claude 5.5 family (checked 2026-11-07). Rates are input price per
    # 1K tokens; output costs 5x more, so the budget is an underestimate.
    models:
      simple: "claude-haiku-5-5"
      balanced: "claude-sonnet-5-5"
      complex: "claude-opus-5-5"
    priority: 6
    cost_per_1k_tokens:
      haiku: 0.0001
      sonnet: 0.002
      opus: 0.004
    use_only_for:
      - complex_reasoning
      - architecture_decisions
      - business_strategy

  openai:
    enabled: true  # ChatGPT - uses same OpenAI-compatible format
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    # gpt-4o and gpt-4o-mini shut down 2027-01-14; OpenAI names gpt-6-luna as
    # the replacement (checked 2026-11-07). Input price per 1K tokens below.
    models:
      default: "gpt-6-luna"
      complex: "gpt-6.1-sol"
    priority: 7
    cost_per_1k_tokens:
      gpt-6-luna: 0.0001
      gpt-6.1-sol: 0.002

  # Aggregator fallback (last resort)
  openrouter:
    enabled: true
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    # Free variants (50 req/day; 1,000/day after a one-time $10 credit purchase).
    # Free model IDs change often; listed as free on 2026-10-20.
    models:
      default: "nvidia/nemotron-3-ultra-550b-a55b:free"
      code: "cohere/north-mini-code:free"
    priority: 99
    cost_per_1k_tokens: variable

# Task-to-provider routing
task_routing:
  morning_brief:
    description: "Daily summary generation"
    prefer:
      - ollama
      - groq
      - cerebras
    fallback: "claude:simple"
    max_tokens: 2048

  code_review:
    description: "Analyze code changes, suggest improvements"
    prefer:
      - ollama:code
      - together:code
      - mistral:code
    fallback: "claude:balanced"
    max_tokens: 4096

  email_parsing:
    description: "Parse Fiverr order emails"
    prefer:
      - ollama:fast
      - groq:fast
      - cerebras
    fallback: "claude:simple"
    max_tokens: 1024

  pr_analysis:
    description: "Analyze pull requests"
    prefer:
      - ollama:code
      - mistral:code
      - together:code
    fallback: "claude:balanced"
    max_tokens: 4096

  complex_reasoning:
    description: "Architecture decisions, business strategy"
    prefer:
      - claude:complex
    fallback: "together:default"
    max_tokens: 8192

  client_communication:
    description: "Generate client emails, responses"
    prefer:
      - ollama
      - groq
      - cerebras
    fallback: "claude:simple"
    max_tokens: 1024

  autocomplete:
    description: "Code completion (local only)"
    prefer:
      - ollama:fast
    fallback: null  # No cloud fallback for autocomplete
    max_tokens: 256

  code_generation:
    description: "Generate code changes from task (simple/moderate)"
    prefer:
      - ollama:code
      - groq
      - gemini:code
      - together:code
    fallback: "claude:balanced"
    max_tokens: 4096

  code_generation_complex:
    description: "Complex multi-file code generation"
    prefer:
      - ollama
      - groq
      - gemini:code
      - together:code
      - mistral:code
      - openai:default
    fallback: "claude:balanced"
    max_tokens: 8192

  task_decomposition:
    description: "Break complex tasks into sequential sub-tasks"
    prefer:
      - ollama
      - groq
      - cerebras
      - gemini
      - together
    fallback: "claude:balanced"
    max_tokens: 2048

  prompt_enhance:
    description: "Enhance short 3D generation prompts into detailed descriptions"
    prefer:
      - ollama:fast
      - groq:fast
      - cerebras
      - gemini
    fallback: "together"
    max_tokens: 300

  scene_analysis:
    description: "Decompose scene prompts into structured asset lists with positions"
    prefer:
      - ollama
      - groq
      - cerebras
      - together
      - mistral
    fallback: "gemini"
    max_tokens: 2000

# Budget limits (daily)
budget:
  daily_limit_usd: 1.00
  alert_threshold_usd: 0.50

  per_provider:
    groq:
      max_requests: 1000  # Rate limited anyway
    cerebras:
      max_requests: 500
    together:
      max_cost_usd: 0.50  # Preserve free credits
    claude:
      max_cost_usd: 0.50
    gemini:
      max_cost_usd: 0.25  # Pro model only (Flash is free)
    openai:
      max_cost_usd: 0.25
