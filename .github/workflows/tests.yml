name: BrightForge Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Self-test isolation check
        run: npm run test-selftest-guard

      - name: Security regression tests
        run: |
          npm run test-bind-policy
          npm run test-security

      - name: Event routing and dead-letter integration
        run: npm run test-events-queue

      - name: Frontend asset check
        run: npm run test-frontend-assets

      - name: Mesh optimize -> export data flow
        run: npm run test-mesh-flow

      - name: Run core self-tests
        run: npm run test-all-core

      - name: Run multi-model architecture tests
        run: npm run test-multi-model

      - name: Run Forge3D module self-tests
        run: |
          npm run test-bridge
          npm run test-forge-session
          npm run test-forge-db
          npm run test-project-manager
          npm run test-queue

      - name: Run orchestration self-tests
        run: |
          npm run test-orch-db
          npm run test-event-bus
          npm run test-task-state
          npm run test-supervisor
          npm run test-handoff
          npm run test-orchestrator

      - name: Run skills orchestrator self-test
        run: npm run test-skills

      - name: Run pipeline agent self-tests
        run: npm run test-agents

      - name: Run WebSocket event bus self-test
        run: npm run test-ws-bus

      - name: Run integration test suite
        run: npm run test-integration

  python-mesh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU-only mesh dependencies
        run: pip install 'trimesh>=4.6.0' numpy pyyaml 'fast-simplification>=0.1.7'

      - name: Mesh post-processing tests
        run: python -m unittest discover -s python/tests -v

  stability-test:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run quick stability test (60s CI mode)
        run: npm run test-stability-quick
        timeout-minutes: 3
